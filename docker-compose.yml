version: '3.8'

services:
  # Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: chinese_practice_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chinese_vocab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chinese_practice_backend
    restart: always
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/chinese_vocab_db?schema=public
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chinese_practice_frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3002
    depends_on:
      - backend

volumes:
  postgres_data:
